[colors]
bg = #1A1D23
bg-main = #0F1115
bg-hover = #2A2F38
border = #3A404C
fg = #C5C8CE
fg-bright = #E6E9EF
accent = #E6E9EF
success = #81C784
urgent = #FF5F87

[bar/main]
monitor = ${env:MONITOR}
width = 100%
height = 22pt
radius = 9

dpi = 96
override-redirect = false

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2pt
border-size = 4pt
border-color = #00000000

padding-left = 2
padding-right = 2
module-margin = 1

separator = |
separator-foreground = ${colors.border}

font-0 = JetBrainsMono Nerd Font:size=12;2

modules-left = systray xworkspaces_main volume
modules-center = date
modules-right = cpu_full gpu memory disk network_full power

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

[bar/secondary]
monitor = ${env:MONITOR}
width = 100%
height = 22pt
radius = 9

dpi = 96
override-redirect = false

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2pt
border-size = 4pt
border-color = #00000000

padding-left = 2
padding-right = 2
module-margin = 1

separator = |
separator-foreground = ${colors.border}

font-0 = JetBrainsMono Nerd Font:size=12;2

modules-left = xworkspaces_secondary
modules-center = date
modules-right = power

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

[module/xworkspaces_main]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces_main.sh
interval = 0
tail = true
format = <label>

[module/xworkspaces_secondary]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces_secondary.sh
interval = 0
tail = true
format = <label>

[module/systray]
type = internal/tray
tray-position = left
tray-spacing = 4px
tray-background = ${colors.bg}
tray-padding = 4px

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 0.1
format = <label>
click-left = ~/.config/polybar/scripts/volume_menu.sh
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/cpu_full]
type = custom/script
exec = ~/.config/polybar/scripts/cpu_full.sh
interval = 2
format = <label>
format-padding = 0

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 2
format = <label>
format-padding = 0

[module/memory]
type = custom/script
exec = ~/.config/polybar/scripts/memory.sh
interval = 2
format = <label>
format-padding = 0

[module/disk]
type = custom/script
exec = ~/.config/polybar/scripts/disk.sh
interval = 10
format = <label>
format-padding = 0

[module/network_full]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
format = <label>
format-padding = 0

[module/power]
type = custom/text
format = 󰐥
click-left = ~/.config/polybar/scripts/powermenu.sh
format-foreground = ${colors.fg-bright}

[module/date]
type = custom/script
interval = 60
exec = ~/.config/polybar/scripts/date.sh
label-foreground = ${colors.fg-bright}
click-left = ~/.config/polybar/scripts/calendar.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
