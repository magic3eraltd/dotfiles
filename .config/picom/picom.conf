backend = "glx";
vsync = true;
unredir-if-possible = false;

# Blur
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-exclude = [
    "class_g = 'Polybar'",
    "window_type = 'dock'",
    "class_g = 'slop'"
];
inactive-dim = 0.05;

# Shadows
shadow = true;
shadow-radius = 30;
shadow-opacity = 0.75;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
    "class_g = 'i3-frame'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Fade
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 7;

# Transparency
inactive-opacity = 0.70;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "95:class_g = 'steam' ",
    "95:class_g = 'obsidian' ",
    "80:class_g = 'Spotify' ",
    "100:class_g = 'firefox'",
    "100:class_g = 'discord'",
    "80:class_g = 'Alacritty'",
    "80:class_g = 'kitty'",
    "80:class_g = 'wezterm'",
    "100:class_g = 'virt-manager'"
];

# Rounding
corner-radius = 10;
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'"
];

# GLX optimization
use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Window animations
animations = true;
animation-stiffness = 150;
animation-dampening = 22;
animation-mass = 1.2;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";

