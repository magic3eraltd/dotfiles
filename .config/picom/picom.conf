backend = "glx";
vsync = true;

# Blur
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-exclude = [
    "class_g = 'Polybar'",
    "window_type = 'dock'"
];
inactive-dim = 0.05;

# Тіні
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.6;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
    "class_g = 'i3-frame'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Fade
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 8;

# Прозорість
inactive-opacity = 0.80;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "90:class_g = 'Spotify' ",
    "100:class_g = 'firefox'",
    "90:class_g = 'discord'",
    "90:class_g = 'Alacritty'",
    "90:class_g = 'kitty'",
    "90:class_g = 'wezterm'"
];

# Заокруглення
corner-radius = 10;
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'"
];

# GLX оптимізація
use-damage = true;

# Window animations
animations = true;
animation-stiffness = 200;
animation-dampening = 15;
animation-mass = 1;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";

